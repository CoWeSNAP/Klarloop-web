<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klarloop – Denk-Abenteuer mit Snap</title>
<meta name="description" content="Klarloop: ein Spiel, bei dem dein Kopf mitspielt. Bald im App Store.">
<style>
  :root { --night: #0f1729; --paper: #edf1f8; --mist: #9fb0cc; --lamp: #ffd27a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #1d2a52, var(--night) 70%); color: var(--paper); font: 17px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif; padding: 24px 16px; }
  main { max-width: 560px; text-align: center; }
  .orb { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, var(--lamp) 45%, #f0a040); box-shadow: 0 0 40px 10px rgba(255, 200, 110, 0.45); }
  h1 { font-size: 40px; margin: 0 0 6px; letter-spacing: -0.5px; }
  .sub { color: var(--lamp); font-weight: 700; margin: 0 0 18px; }
  p { margin: 0 0 14px; }
  .soon { display: inline-block; margin-top: 8px; padding: 10px 18px; border: 1px solid var(--lamp); border-radius: 999px; color: var(--lamp); font-weight: 700; }
  footer { margin-top: 36px; color: var(--mist); font-size: 14px; }
  footer a { color: var(--mist); margin: 0 8px; }
</style>
</head>
<body>
<main>
  <div class="orb" aria-hidden="true"></div>
  <h1>Klarloop</h1>
  <p class="sub">Denk-Abenteuer mit Snap</p>
  <p>Flieg, lauf und renn mit Snap durch vierzehn Welten – und halte dabei Muster, Farben und Regeln im Kopf.</p>
  <p>Klarloop passt sich an dich an. Kein Abo, kein Konto nötig.</p>
  <span class="soon">Bald im App Store</span>
  <footer>
    <a href="/impressum">Impressum</a>
    <a href="/datenschutz">Datenschutz</a>
    <a href="/support">Support</a>
  </footer>
</main>
</body>
</html>
